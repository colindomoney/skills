# The only file a new project edits. bootstrap.sh and deploy.sh both source it.
# Also replace PROJECT in docker-compose.yml. bash 3.2 safe: no associative arrays.

PROJECT="PROJECT"                       # container and image name
PROFILES=(PROFILE_ONE PROFILE_TWO)      # one per role; all share one gateway
BOT_PROFILES=(PROFILE_ONE)              # profiles with their own bot token
DATA_DIRS=(data)                        # irreplaceable data, for backup.sh; mount them too

description_for() {
  case "$1" in
    PROFILE_ONE) echo "What PROFILE_ONE does, one line" ;;
    PROFILE_TWO) echo "What PROFILE_TWO does, one line" ;;
  esac
}

# Skill folders under skills/ that each profile gets.
skills_for() {
  case "$1" in
    *) echo "" ;;
  esac
}

# Working directory for tool calls. Every writable path must be in
# HERMES_WRITE_SAFE_ROOT in docker-compose.yml.
cwd_for() { echo "/opt/data/profiles/$1"; }

# Optional model pin. Empty copies the root login's model block on each run.
model_for() { echo ""; }

# Toolsets a profile must never have. Never list composites such as debugging,
# safe or coding: they expand to terminal and file tools. Check names with:
#   docker exec --user hermes PROJECT hermes tools list
disabled_for() {
  case "$1" in
    *) echo "browser computer_use" ;;
  esac
}

# Optional shell hooks, one per line: profile|event|script|matcher
# Scripts live in scripts/; matcher applies to pre/post_tool_call and may be empty.
HOOKS=""
